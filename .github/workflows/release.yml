name: Production

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

concurrency:
  group: production-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Production quality
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable action
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check Rust backend
        working-directory: src-tauri
        run: cargo check

  production-candidate:
    name: Production candidate (${{ matrix.platform }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundle-args: --bundles dmg
            artifact-name: macos-dmg
            bundle-requirements: src-tauri/target/release/bundle/dmg|.dmg
          - platform: windows-latest
            bundle-args: --bundles msi,nsis
            artifact-name: windows-installers
            bundle-requirements: |
              src-tauri/target/release/bundle/msi|.msi
              src-tauri/target/release/bundle/nsis|.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable action
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Read application version
        id: app-version
        shell: node {0}
        run: |
          const fs = require("node:fs");
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (!packageJson.version) {
            throw new Error("package.json does not define an application version");
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "version=" + packageJson.version + "\n");

      - name: Build unsigned production candidate installer
        # Remove --no-sign only when code-signing credentials and policy are deliberately enabled.
        run: npm run tauri build -- --no-sign ${{ matrix.bundle-args }}

      - name: Verify bundle paths and write checksums
        env:
          APP_VERSION: ${{ steps.app-version.outputs.version }}
          ARTIFACT_NAME: ${{ matrix.artifact-name }}
          BUNDLE_REQUIREMENTS: ${{ matrix.bundle-requirements }}
          CANDIDATE_ARTIFACT_DIRECTORY: production-candidate
        shell: node {0}
        run: |
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");

          const requirements = process.env.BUNDLE_REQUIREMENTS
            .split(/\r?\n/)
            .map((requirement) => requirement.trim())
            .filter(Boolean);
          const files = [];

          for (const requirement of requirements) {
            const [directory, extension] = requirement.split("|");
            if (!directory || !extension) {
              throw new Error("Bundle requirement must be DIRECTORY|EXTENSION: " + requirement);
            }
            if (!fs.existsSync(directory) || !fs.statSync(directory).isDirectory()) {
              throw new Error("Expected bundle directory is missing: " + directory);
            }

            const matches = fs.readdirSync(directory).filter((entry) => {
              const file = path.join(directory, entry);
              return fs.statSync(file).isFile() && entry.endsWith(extension);
            });
            if (matches.length === 0) {
              throw new Error("Expected bundle output is missing: " + directory + "/*" + extension);
            }
            for (const entry of matches) {
              files.push({
                source: path.join(directory, entry),
                bundleDirectory: path.basename(directory),
                fileName: entry,
              });
            }
          }

          for (const file of files) {
            if (!file.fileName.includes(process.env.APP_VERSION)) {
              throw new Error(
                "Bundle filename does not contain " +
                  process.env.APP_VERSION +
                  ": " +
                  file.source,
              );
            }
          }

          const artifactRoot = process.env.CANDIDATE_ARTIFACT_DIRECTORY;
          const bundlesRoot = path.join(artifactRoot, "bundles", process.env.ARTIFACT_NAME);
          const checksumsRoot = path.join(artifactRoot, "checksums");
          fs.mkdirSync(bundlesRoot, { recursive: true });
          fs.mkdirSync(checksumsRoot, { recursive: true });
          const checksums = files
            .sort((left, right) => left.source.localeCompare(right.source))
            .map((file) => {
              const destination = path.join(
                bundlesRoot,
                file.bundleDirectory,
                file.fileName,
              );
              fs.mkdirSync(path.dirname(destination), { recursive: true });
              fs.copyFileSync(file.source, destination);
              const digest = crypto
                .createHash("sha256")
                .update(fs.readFileSync(destination))
                .digest("hex");
              const relativePath = path.relative(artifactRoot, destination).split(path.sep).join("/");
              return digest + "  " + relativePath;
            })
            .join("\n");
          fs.writeFileSync(
            path.join(checksumsRoot, process.env.ARTIFACT_NAME + ".sha256"),
            checksums + "\n",
          );

          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            "### Unsigned production candidate\n\n" +
              "- Version: " + process.env.APP_VERSION + "\n" +
              "- Commit: " + process.env.GITHUB_SHA + "\n" +
              "- Bundles verified: " + files.length + "\n" +
              "- Checksum paths are relative to the downloaded artifact root.\n" +
              "- This output is test material; no GitHub Release or updater feed was changed.\n",
          );

      - name: Upload unsigned production candidate installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PRODUCTION-CANDIDATE-${{ steps.app-version.outputs.version }}-${{ github.sha }}-${{ matrix.artifact-name }}
          path: production-candidate
          if-no-files-found: error
          retention-days: 14

  promotion-source:
    name: Main promotion source
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require promotion from the repository staging branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$BASE_REF" != "main" ]]; then
            echo "Expected a pull request targeting main; got $BASE_REF."
            exit 1
          fi
          if [[ "$HEAD_REF" != "staging" ]]; then
            echo "Production promotion PRs must come from staging; got $HEAD_REF."
            exit 1
          fi
          if [[ "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            echo "The promotion source must be the repository's staging branch, not a fork."
            exit 1
          fi

  tag-on-main:
    name: Version tag is on main
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify tag commit is reachable from main
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          tag_commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$tag_commit" "origin/main"; then
            echo "Version tag $GITHUB_REF_NAME does not point to a commit on main."
            exit 1
          fi

  version-consistency:
    name: Version tag matches app
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify strict version tag and application versions
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");

          const tag = process.env.VERSION_TAG;
          const match = /^v(\d+\.\d+\.\d+)$/.exec(tag);
          if (!match) {
            throw new Error(`Version tag must match vMAJOR.MINOR.PATCH exactly; received ${tag}`);
          }

          const expected = match[1];
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const packageLock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const cargoToml = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
          const cargoLock = fs.readFileSync("src-tauri/Cargo.lock", "utf8");
          const tauriConfig = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
          const cargoVersion = /^\[package\][\s\S]*?^version\s*=\s*"([^"]+)"/m.exec(cargoToml)?.[1];
          const cargoLockVersion = /\[\[package\]\]\nname = "service-timer"\nversion = "([^"]+)"/.exec(cargoLock)?.[1];
          const versions = {
            "package.json": packageJson.version,
            "package-lock.json": packageLock.version,
            "package-lock.json packages root": packageLock.packages?.[""]?.version,
            "src-tauri/Cargo.toml": cargoVersion,
            "src-tauri/Cargo.lock": cargoLockVersion,
            "src-tauri/tauri.conf.json": tauriConfig.version,
          };

          for (const [source, version] of Object.entries(versions)) {
            if (version !== expected) {
              throw new Error(`${source} reports ${version ?? "no version"}; expected ${expected}`);
            }
          }

          console.log(`Verified ${tag} against all application version sources.`);
          NODE

  release:
    name: Create draft ${{ matrix.platform }} installer
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs:
      - quality
      - tag-on-main
      - version-consistency
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundle-args: --bundles dmg
          - platform: windows-latest
            bundle-args: --bundles msi,nsis

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable action
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload draft installer
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Configure these repository secrets before enabling signed distribution:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Service Timer ${{ github.ref_name }} (Draft)"
          releaseBody: "Draft release for maintainer testing. Do not distribute until the installers are signed/notarized and this release is manually published."
          releaseDraft: true
          prerelease: false
          # Remove --no-sign only when code-signing credentials and policy are deliberately enabled.
          args: --no-sign ${{ matrix.bundle-args }}
