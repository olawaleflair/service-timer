name: Promote staging to production

on:
  workflow_dispatch:

concurrency:
  group: promote-staging-to-production
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  open-promotion-pr:
    name: Open staging to main pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify staging has production changes
        run: |
          set -euo pipefail
          git fetch origin main staging --no-tags
          if git diff --quiet origin/main origin/staging; then
            echo "Staging and main contain the same source; there is nothing to promote."
            exit 1
          fi

      - name: Create a staging-verified promotion branch
        id: promotion
        run: |
          set -euo pipefail
          staging_sha="$(git rev-parse origin/staging)"
          main_sha="$(git rev-parse origin/main)"
          branch="promote/staging-${staging_sha:0:12}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          promotion_sha="$(
            printf 'Promote staging %s to production\n' "$staging_sha" |
              git commit-tree "${staging_sha}^{tree}" -p "$main_sha"
          )"

          git push origin "$promotion_sha:refs/heads/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open or reuse the promotion pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_BRANCH: ${{ steps.promotion.outputs.branch }}
        run: |
          set -euo pipefail
          existing_url="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$PROMOTION_BRANCH" \
              --state open \
              --json url \
              --jq '.[0].url // empty'
          )"

          if [[ -n "$existing_url" ]]; then
            echo "Promotion pull request already open: $existing_url"
            exit 0
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$PROMOTION_BRANCH" \
            --title "Promote staging to production" \
            --body $'## Production promotion\n\nThis pull request was opened by the owner-triggered promotion workflow. Its commit is based on the current `main` commit and its complete source tree exactly matches the current `staging` branch. The required `Main promotion source` check verifies both properties.\n\nBefore merging:\n\n- Review the complete diff.\n- Wait for `Production quality` and `Main promotion source`.\n- Confirm the latest `Staging quality` and platform test builds succeeded.\n- Obtain approval from the project owner as CODEOWNER.\n- Squash-merge only when the production change is ready.\n\nThis workflow does not approve, merge, enable auto-merge, or bypass branch protection.'
