name: Promote staging to production

on:
  workflow_dispatch:

concurrency:
  group: promote-staging-to-production
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  open-promotion-pr:
    name: Open staging to main pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify staging has production changes
        run: |
          set -euo pipefail
          git fetch origin main staging --no-tags
          if git diff --quiet origin/main origin/staging; then
            echo "Staging and main contain the same source; there is nothing to promote."
            exit 1
          fi

      - name: Open or reuse the promotion pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing_url="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head staging \
              --state open \
              --json url \
              --jq '.[0].url // empty'
          )"

          if [[ -n "$existing_url" ]]; then
            echo "Promotion pull request already open: $existing_url"
            exit 0
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head staging \
            --title "Promote staging to production" \
            --body $'## Production promotion\n\nThis pull request was opened by the owner-triggered promotion workflow. It contains the changes currently validated on `staging`.\n\nBefore merging:\n\n- Review the complete diff.\n- Wait for `Production quality` and `Main promotion source`.\n- Confirm the latest `Staging quality` and platform test builds succeeded.\n- Obtain approval from the project owner as CODEOWNER.\n- Squash-merge only when the production change is ready.\n\nThis workflow does not approve, merge, or enable auto-merge.'
